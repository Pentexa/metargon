# =============================================================================
# METARGON Academy v0.1 — deterministic training configuration
# =============================================================================
# Every value here is pre-registered. Changing any value invalidates the
# config fingerprint and produces a different experiment identity.
# All splits are derived from `pool_split` and are immutable for a run.

[meta]
name = "academy_v01"
version = "0.1.0"
author = "METARGON Research"
created = "2026-11-07"

[seeds]
pool_split = 20260901      # split generation seed (immutable)
run = 20261107             # training-loop seed
eval = 20261108            # evaluation seed (paired across policies)
ood = 20261109             # OOD evaluation seed

[world]
width = 7
height = 5
max_steps = 80             # generous episode budget
tight_steps = 44           # tight-budget condition
noise_q = 0.08             # corrupted-reading probability (noisy condition)

[taskgen]
train_n = 100
val_n = 25
test_n = 25
ood_n = 25                 # OOD configuration count (fully held out)

[training]
mode = "curriculum"        # "curriculum" | "sequential"
episodes_per_block = 40
total_episodes = 480       # per-policy training budget
eval_every = 120           # frozen-val evaluation during training (curves)
replay_on = true
replay_capacity = 4000
replay_batch = 64
replay_frequency = 8       # replay pass every K episodes
q_alpha = 0.30
q_gamma = 0.95
q_eps0 = 0.35
q_eps_min = 0.05
episodic_mem_max = 400
planner_max_expand = 1500
probe_max_plans = 4
memory_max_hypotheses = 128
memory_verify_support = 3
memory_max_contradict = 2
memory_predict_threshold = 1
memory_contradict_window = 3

[curriculum]
difficulty_labels = ["easy", "medium", "hard"]
success_target = 0.85
min_confidence = 0.60
window = 20                # episodes used for measured progress
harder_epsilon = 0.10      # promote bin when success >= target - eps
easier_epsilon = 0.20      # demote bin when success < target - eps

[evaluation]
seeds = 30                 # paired evaluation seeds (30 where feasible)
episodes_per_seed = 240
snapshot_limits = [40, 80, 160, 240]   # learning-curve snapshot points

[checkpoint]
dir = "checkpoints/academy_v01"
every_episodes = 20        # crash-safe snapshot cadence (training)
keep_last = 5

# ==============================================================================
# EVREN LLM integration (curriculum teacher only — never the decision brain)
# ==============================================================================
[evren]
enabled = true
base_url = "https://evren-llmapi.ssyz.org.tr/v1"
api_key_env = "EVREN_API_KEY"     # never hardcoded; read at call time
primary_teacher = "GLM-5.3"
secondary_teacher = "DeepSeek V4.1 Flash"
# Per-run call budget (teacher calls, not student decisions). The default is
# 10. Increase ONLY explicitly (config or --override); negative/unlimited is
# forbidden unless allow_unlimited is explicitly set to true.
max_calls_per_run = 10
allow_unlimited = false
max_total_tokens = 0               # 0 = no token cap beyond call cap
timeout = 60.0                     # seconds (connect + read)
max_retries = 3                    # exponential backoff on 429/5xx
max_tokens = 1024                  # completion output limit (per call)
temperature = 0.7
seed = 20261107
pilot_n = 10                       # reproducible pilot size
registry_dir = "results/academy_v01/evren"

# v0.2 adaptive curriculum experiment (zero network calls by design).
# Changing these values changes the experiment fingerprint recorded in
# results/academy_v01/evren/curriculum_v02_summary.json.
[evren.curriculum]
seed = 20261107
episodes = 160           # training episodes per condition
block_size = 40          # retention probe cadence (episodes)
substrate_share = 0.30   # shared frozen-substrate slot share (matched)
substrate_classic_n = 8  # classic configs in the shared substrate
n_procedural = 24        # fresh procedural candidates for proc_lp
retention_eps_per_cfg = 2
test_grid_n = 12         # independently sampled test configs (final eval)
eval_eps_per_cfg = 4
holdout_eps_per_seed = 4
ood_probe_n = 8
ood_eps_per_seed = 3
lp_window = 10
lp_min_visits = 3
lp_weight = 1.0
weakness_weight = 1.2
novelty_weight = 0.8
explore_eps = 0.15
weakness_target = 0.75
