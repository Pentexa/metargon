<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>METARGON NEST</title>
<style>
  :root {
    --bg:#0f1520; --panel:#182131; --panel2:#1f2b3d; --text:#dbe6f3;
    --dim:#8fa3bd; --accent:#5ec8ff; --good:#65d69b; --bad:#ff8a8a;
    --warn:#ffd166; --border:#2b3b55;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px; background:linear-gradient(90deg,#141e30,#1c2a44); border-bottom:1px solid var(--border); }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  .sub { color:var(--dim); font-size:12px; }
  #status-pill { margin-left:auto; padding:4px 12px; border-radius:999px; font-size:12px; background:var(--panel2); border:1px solid var(--border); }
  #status-pill.running { background:#123824; border-color:var(--good); color:var(--good); }
  #status-pill.paused { background:#3a2c10; border-color:var(--warn); color:var(--warn); }
  main { display:grid; grid-template-columns: 330px 1fr 360px; gap:14px; padding:14px; height:calc(100vh - 62px); }
  section { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; flex-direction:column; min-height:0; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin:0 0 10px; }
  /* conversation */
  #chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px; }
  .msg { max-width:92%; padding:8px 10px; border-radius:10px; font-size:13px; line-height:1.45; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:#24415f; }
  .msg.bot { align-self:flex-start; background:var(--panel2); }
  .msg.sys { align-self:center; color:var(--dim); font-size:11px; }
  .inputrow { display:flex; gap:8px; margin-top:10px; }
  #input { flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); outline:none; }
  #send { background:var(--accent); border:0; color:#062033; font-weight:600; padding:0 16px; border-radius:10px; cursor:pointer; }
  /* controls */
  #controls { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  #controls button { flex:1 1 30%; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer; font-size:12px; }
  #controls button:hover { border-color:var(--accent); }
  /* world */
  #world { flex:1; display:flex; align-items:center; justify-content:center; }
  canvas { max-width:100%; max-height:100%; border-radius:8px; background:#0a1019; }
  #world-meta { color:var(--dim); font-size:12px; min-height:18px; margin-top:8px; text-align:center; }
  /* memory */
  #memory { flex:1; overflow-y:auto; font-size:12.5px; }
  .kpi { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .kpi div { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; flex:1 1 30%; text-align:center; }
  .kpi b { display:block; font-size:16px; }
  .hyp { background:var(--panel2); border-left:3px solid var(--border); border-radius:6px; padding:7px 9px; margin-bottom:7px; }
  .hyp.verified { border-left-color:var(--good); }
  .hyp.contradicted { border-left-color:var(--bad); opacity:.75; }
  .hyp .tag { font-size:11px; color:var(--dim); }
  .trace { color:var(--dim); font-size:11.5px; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>METARGON NEST</h1>
  <span class="sub">interactive home for the Academy student agent</span>
  <span id="status-pill">idle</span>
</header>
<main>
  <section>
    <h2>Conversation</h2>
    <div id="chat"></div>
    <div class="inputrow">
      <input id="input" placeholder="Talk to Metargon…" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div id="controls">
      <button data-op="start">Start</button>
      <button data-op="pause">Pause</button>
      <button data-op="continue">Continue</button>
      <button data-op="step">Single-step</button>
      <button data-op="stop">Stop</button>
      <button data-op="reset">Reset episode</button>
      <button data-op="save">Save</button>
      <button data-op="restore">Restore</button>
      <button data-op="fresh">Fresh start</button>
    </div>
  </section>

  <section>
    <h2>Live World</h2>
    <div id="world"><canvas id="cv" width="420" height="300"></canvas></div>
    <div id="world-meta"></div>
  </section>

  <section>
    <h2>Learning &amp; Memory</h2>
    <div id="memory"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), memo = $("memory");
let state = null;

function addMsg(kind, text){
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});
  return r.json();
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  addMsg("user", text);
  const res = await post("/api/command", {text});
  if(res.reply) addMsg("bot", res.reply);
  if(res.snapshot) render(res.snapshot);
}

async function control(op, params){
  const res = await post("/api/control", {op, params});
  if(res && res.status !== undefined) render(res);
}

async function tick(){
  try{
    const r = await fetch("/api/state");
    state = await r.json();
    render(state);
  }catch(e){}
}

function render(s){
  const pill = $("status-pill");
  pill.textContent = s.status;
  pill.className = s.status === "running" ? "running" : (s.status === "paused" ? "paused" : "");
  drawWorld(s.world);
  $("world-meta").textContent = s.world.present
    ? `steps ${s.world.steps}/${s.world.max_steps} · last ${s.world.last_action||"–"} · ${s.world.finished?"finished":(s.world.last_events.length? s.world.last_events.map(e=>e.join(" ")).join(", ") : "exploring")}`
    : "no environment yet — press Start";
  renderMemory(s.memory, s.trace);
}

function drawWorld(w){
  const cv = $("cv"), ctx = cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!w.present){ ctx.fillStyle="#8fa3bd"; ctx.font="14px sans-serif"; ctx.fillText("No world loaded.",40,150); return; }
  const CW=60, CH=60, OX=0, OY=0;
  ctx.font = "bold 16px sans-serif";
  // floor
  for(let x=0;x<7;x++) for(let y=0;y<5;y++){
    ctx.fillStyle = (x+y)%2 ? "#101a2a" : "#0c1422";
    ctx.fillRect(OX+x*CW, OY+y*CH, CW, CH);
  }
  // walls
  ctx.fillStyle = "#2e3c55";
  for(const [x,y] of w.walls) ctx.fillRect(OX+x*CW, OY+y*CH, CW, CH);
  // goal
  ctx.strokeStyle = "#65d69b"; ctx.lineWidth=3;
  ctx.strokeRect(OX+w.goal[0]*CW+6, OY+w.goal[1]*CH+6, CW-12, CH-12);
  ctx.fillStyle="#65d69b"; ctx.fillText("G", OX+w.goal[0]*CW+20, OY+w.goal[1]*CH+36);
  // doors
  for(const [d,c] of Object.entries(w.doors)){
    const cell = w.door_cell[d];
    ctx.fillStyle = c ? "#65d69b" : "#ff8a8a";
    ctx.fillRect(OX+cell[0]*CW+10, OY+cell[1]*CH+10, CW-20, CH-20);
    ctx.fillStyle = "#0a1019";
    ctx.fillText(d, OX+cell[0]*CW+16, OY+cell[1]*CH+36);
  }
  // switches
  for(const [s,c] of Object.entries(w.switch_cell)){
    const on = w.switches[s];
    ctx.fillStyle = on ? "#ffd166" : "#5a6b86";
    ctx.beginPath(); ctx.arc(OX+c[0]*CW+CW/2, OY+c[1]*CH+CH/2, 14, 0, 7);
    ctx.fill(); ctx.fillStyle="#0a1019"; ctx.fillText(s, OX+c[0]*CW+14, OY+c[1]*CH+38);
  }
  // plates
  for(const [p,c] of Object.entries(w.plate_cell)){
    const load = w.plates[p];
    ctx.fillStyle = "#3a4a6b"; ctx.strokeStyle="#8fa3bd";
    ctx.beginPath(); ctx.arc(OX+c[0]*CW+CW/2, OY+c[1]*CH+CH/2, 16, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#0a1019"; ctx.fillText(load==="none"?"":load, OX+c[0]*CW+16, OY+c[1]*CH+38);
  }
  // objects
  for(const [o,c] of Object.entries(w.objs)){
    ctx.fillStyle = "#c9a6ff"; ctx.beginPath(); ctx.arc(OX+c[0]*CW+CW/2, OY+c[1]*CH+CH/2, 12, 0, 7); ctx.fill();
    ctx.fillStyle="#0a1019"; ctx.fillText(o, OX+c[0]*CW+18, OY+c[1]*CH+36);
  }
  // agent
  const [px,py] = w.pos;
  ctx.fillStyle = "#5ec8ff"; ctx.beginPath(); ctx.arc(OX+px*CW+CW/2, OY+py*CH+CH/2, 15, 0, 7); ctx.fill();
  ctx.fillStyle="#062033"; ctx.font="bold 14px sans-serif"; ctx.fillText("M", OX+px*CW+17, OY+py*CH+35);
}

function renderMemory(m, tr){
  if(!m) return;
  let html = '<div class="kpi">';
  const st = m.stats||{};
  html += `<div><b>${st.verified||0}</b>verified</div>`;
  html += `<div><b>${st.contradicted||0}</b>contradicted</div>`;
  html += `<div><b>${(st.hypothesis||0)+(st.predicted||0)}</b>uncertain</div>`;
  html += `<div><b>${m.generated||0}</b>generated</div></div>`;
  (m.hypotheses||[]).slice(0,30).forEach(h=>{
    const cls = "hyp " + (h.status==="verified"?"verified":h.status==="contradicted"?"contradicted":"");
    html += `<div class="${cls}">door ${h.door}: ${h.antecedent_text||"(empty)"}<br>`+
            `<span class="tag">[${h.status}] support ${h.sup} · con ${h.con} · conf ${h.confidence}`+
            (h.from_earlier_episodes ? " · from earlier episodes" : "") + "</span></div>";
  });
  if(tr){
    html += '<div class="trace">memory actions: '+((tr.memory_actions||0))+
           ' · correct '+(tr.memory_correct||0)+' · incorrect '+(tr.memory_incorrect||0)+
           ' · hypothesis retrievals '+(tr.hypothesis_retrieved||0)+
           ' · cross-epoch transfer '+(tr.cross_epoch_transfer_retrieved||0)+'</div>';
  }
  memo.innerHTML = html;
}

$("send").onclick = send;
input.addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });
document.querySelectorAll("#controls button").forEach(b=>{
  b.onclick = ()=> control(b.dataset.op);
});

addMsg("bot", "Hello! I'm Metargon. Ask me anything — or say 'help'.");
setInterval(tick, 250);
tick();
</script>
</body>
</html>
