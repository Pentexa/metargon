<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METARGON NEST</title>
<style>
  :root {
    --bg:#0b1020; --bg2:#0e1528;
    --panel:#131c33; --panel2:#1a2542; --panel3:#202d4f;
    --text:#e6eefb; --dim:#93a5c4; --faint:#5e6f8f;
    --accent:#5ec8ff; --accent2:#8f7bff; --good:#5ee6a0; --bad:#ff8a8a;
    --warn:#ffd166; --border:#243352; --border2:#2e4066;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --r:16px; --r-sm:10px;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(94,200,255,.12), transparent 60%),
      radial-gradient(1000px 500px at 10% 110%, rgba(143,123,255,.10), transparent 60%),
      var(--bg);
    color:var(--text); overflow:hidden;
  }
  header {
    display:flex; align-items:center; gap:14px; padding:14px 20px;
    background:linear-gradient(180deg, rgba(26,37,66,.9), rgba(13,18,32,.65));
    border-bottom:1px solid var(--border); backdrop-filter:blur(8px);
    position:relative; z-index:5;
  }
  .logo { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); font-weight:800; color:#08122a; font-size:16px; }
  header h1 { font-size:17px; margin:0; letter-spacing:.4px; font-weight:700; }
  .sub { color:var(--dim); font-size:12px; }
  .head-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
  #api-badge { font-size:11px; padding:4px 10px; border-radius:999px; background:var(--panel3); border:1px solid var(--border2); color:var(--dim); }
  #api-badge.llm { color:var(--accent); border-color:var(--accent); }
  #status-pill { padding:5px 14px; border-radius:999px; font-size:12px; font-weight:600;
    background:var(--panel3); border:1px solid var(--border2); color:var(--dim); transition:all .2s; }
  #status-pill.running { background:#0f2b1c; border-color:var(--good); color:var(--good); box-shadow:0 0 14px rgba(94,230,160,.25); }
  #status-pill.paused { background:#332a12; border-color:var(--warn); color:var(--warn); }
  #status-pill.finished { background:#123043; border-color:var(--accent); color:var(--accent); }
  #notice-bar { display:none; padding:8px 16px; font-size:12.5px; background:#352a12; border-bottom:1px solid #4d3d18; color:var(--warn); }
  #notice-bar.visible { display:block; }
  main {
    display:grid; grid-template-columns:340px minmax(0,1fr) 380px; gap:14px;
    padding:14px; height:calc(100vh - 70px);
  }
  section {
    background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--border); border-radius:var(--r); padding:14px;
    display:flex; flex-direction:column; min-height:0; box-shadow:var(--shadow);
  }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:1.4px; color:var(--accent);
    margin:0 0 12px; display:flex; align-items:center; gap:8px; font-weight:700; }
  h2 .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  /* ---------- conversation ---------- */
  #chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;
    padding-right:6px; scroll-behavior:smooth; }
  .msg { max-width:92%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; animation:pop .18s ease; }
  @keyframes pop { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,#2b4c74,#24415f); border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--panel3); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg.sys { align-self:center; color:var(--faint); font-size:11.5px; background:transparent; border:0; }
  .msg.action { align-self:center; color:var(--accent); font-size:12px; background:rgba(94,200,255,.08); border:1px dashed var(--accent); border-radius:999px; padding:5px 12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px; }
  .chip { font-size:11.5px; padding:5px 10px; border-radius:999px; cursor:pointer;
    background:var(--panel3); border:1px solid var(--border2); color:var(--dim); transition:all .15s; }
  .chip:hover { color:var(--text); border-color:var(--accent); transform:translateY(-1px); }
  .inputrow { display:flex; gap:8px; margin-top:10px; }
  #input { flex:1; padding:11px 14px; border-radius:12px; border:1px solid var(--border2);
    background:var(--panel2); color:var(--text); outline:none; font-size:13.5px; transition:border .15s; }
  #input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(94,200,255,.15); }
  #send { background:linear-gradient(135deg,var(--accent),#3aa8e0); border:0; color:#062033;
    font-weight:700; padding:0 18px; border-radius:12px; cursor:pointer; font-size:13px; transition:filter .15s; }
  #send:disabled { filter:grayscale(.7) opacity(.6); cursor:default; }
  #send:not(:disabled):hover { filter:brightness(1.08); }
  /* ---------- controls ---------- */
  #controls { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; }
  #controls button { padding:8px 4px; border-radius:var(--r-sm); font-size:12px; font-weight:600;
    border:1px solid var(--border2); background:var(--panel3); color:var(--text); cursor:pointer; transition:all .15s; }
  #controls button:hover { border-color:var(--accent); background:#26355c; transform:translateY(-1px); }
  #controls button:active { transform:translateY(0); }
  /* ---------- world ---------- */
  #challenge { font-size:12.5px; color:var(--dim); background:var(--panel3); border:1px solid var(--border);
    border-radius:var(--r-sm); padding:8px 12px; margin-bottom:10px; min-height:34px; }
  #challenge b { color:var(--accent); }
  #world { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { max-width:100%; max-height:100%; border-radius:12px; background:#080d18; border:1px solid var(--border); }
  #world-meta { color:var(--dim); font-size:12px; min-height:18px; margin-top:10px; text-align:center; }
  #world-meta .ev { color:var(--accent); }
  /* ---------- memory ---------- */
  #memory { flex:1; overflow-y:auto; font-size:12.5px; padding-right:6px; max-height:42%; }
  .teach-panel { border-top:1px solid var(--border); margin-top:10px; padding-top:10px; }
  .teach-panel h3 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--warn); margin:0 0 8px; }
  #teach-area { overflow-y:auto; max-height:180px; font-size:11.5px; color:var(--dim); }
  .teach-item { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:6px 8px; margin-bottom:6px; }
  .teach-item b { color:var(--text); }
  .teach-item .muted { color:var(--faint); font-size:10.5px; }
  .teach-delta { font-size:11px; margin:4px 0 8px; color:var(--accent); }
  .kpi { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .kpi div { background:var(--panel2); border:1px solid var(--border); border-radius:var(--r-sm);
    padding:8px 6px; text-align:center; }
  .kpi b { display:block; font-size:18px; font-weight:800; color:var(--text); }
  .kpi span { font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .hyp { background:var(--panel2); border:1px solid var(--border); border-left:3px solid var(--faint);
    border-radius:10px; padding:9px 11px; margin-bottom:8px; }
  .hyp.verified { border-left-color:var(--good); }
  .hyp.contradicted { border-left-color:var(--bad); opacity:.65; }
  .hyp.predicted { border-left-color:var(--warn); }
  .hyp-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; font-weight:600; }
  .hyp .tag { font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; }
  .hyp .ant { color:var(--text); font-family:"Cascadia Mono",Consolas,monospace; font-size:12px; margin-bottom:6px; }
  .bar { height:5px; background:var(--panel3); border-radius:999px; overflow:hidden; margin-bottom:6px; }
  .bar i { display:block; height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--good), var(--accent)); }
  .trace { color:var(--faint); font-size:11px; }
  ::-webkit-scrollbar { width:9px; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:999px; }
  ::-webkit-scrollbar-thumb:hover { background:#3b5480; }
  ::-webkit-scrollbar-track { background:transparent; }
  @media (max-width:1120px) {
    body { overflow:auto; }
    main { grid-template-columns:1fr; height:auto; }
    section { min-height:360px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <div>
    <h1>METARGON NEST</h1>
    <div class="sub">interactive home for the Academy student agent</div>
  </div>
  <div class="head-right">
    <span id="api-badge">API: …</span>
    <span id="status-pill">idle</span>
  </div>
</header>
<div id="notice-bar"></div>
<main>
  <section>
    <h2><span class="dot"></span>Conversation</h2>
    <div id="chat"></div>
    <div class="chips" id="chips">
      <button class="chip" data-text="Hello, Metargon!">👋 Hello</button>
      <button class="chip" data-text="What do you remember?">🧠 What do you remember?</button>
      <button class="chip" data-text="Show me your current hypothesis">🔬 Current hypothesis</button>
      <button class="chip" data-text="Open door D1">🚪 Open door D1</button>
      <button class="chip" data-text="Try a harder challenge">🔥 Harder challenge</button>
      <button class="chip" data-text="Why did you do that?">❓ Why?</button>
      <button class="chip" data-text="Save progress">💾 Save</button>
    </div>
    <div class="inputrow">
      <input id="input" placeholder="Talk to Metargon…" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div id="controls">
      <button data-op="start">▶ Start</button>
      <button data-op="pause">⏸ Pause</button>
      <button data-op="continue">⏯ Continue</button>
      <button data-op="step">⏭ Single-step</button>
      <button data-op="stop">⏹ Stop</button>
      <button data-op="reset">↺ Reset episode</button>
      <button data-op="save">💾 Save</button>
      <button data-op="restore">📂 Restore</button>
      <button data-op="fresh">✨ Fresh start</button>
    </div>
  </section>

  <section>
    <h2><span class="dot"></span>Live World</h2>
    <div id="challenge">No challenge yet — press Start or ask for a door.</div>
    <div id="world"><canvas id="cv" width="420" height="300"></canvas></div>
    <div id="world-meta"></div>
  </section>

  <section>
    <h2><span class="dot"></span>Learning &amp; Memory</h2>
    <div id="memory"></div>
    <div class="teach-panel">
      <h3>🧑‍🏫 Teaching</h3>
      <div class="inputrow">
        <input id="teach-input" placeholder='e.g. "try switch S1" · "load P1" · "door D2"' autocomplete="off">
        <button id="teach-send">Guide</button>
      </div>
      <div id="teach-area" class="teach-area"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $("chat"), input = $("input"), memo = $("memory"),
      pill = $("status-pill"), badge = $("api-badge"), notice = $("notice-bar"),
      challengeEl = $("challenge"), meta = $("world-meta"), cv = $("cv"),
      teachInput = $("teach-input"), teachArea = $("teach-area");
let state = null, sending = false, apiMode = "…";

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function addMsg(kind, text){
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function setNotice(text){
  if(text){ notice.textContent = text; notice.classList.add("visible"); }
  else notice.classList.remove("visible");
}

async function post(path, body){
  const r = await fetch(path, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body||{})
  });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function send(){
  const text = input.value.trim();
  if(!text || sending) return;
  sending = true; $("send").disabled = true;
  addMsg("user", text);
  input.value = "";
  addMsg("sys", "Metargon is thinking…");
  try{
    const res = await post("/api/command", {text});
    // replace the thinking line with the answer
    const thinking = chat.querySelector(".msg.sys:last-of-type");
    if(thinking) chat.removeChild(thinking);
    const reply = (res && res.reply) || "I processed that, but have nothing to add yet.";
    addMsg("bot", reply);
    if(res && res.action_note) addMsg("action", res.action_note);
    if(res && res.snapshot) render(res.snapshot);
    if(res && res.mode) reflectMode(res.mode);
  }catch(e){
    addMsg("sys", "Connection to the NEST backend failed (" + e.message + "). Is the server still running?");
  }finally{
    sending = false; $("send").disabled = false; input.focus();
  }
}

function reflectMode(mode){
  apiMode = mode === "llm" ? "LLM" : "command";
  badge.textContent = "mode: " + apiMode;
  badge.className = mode === "llm" ? "llm" : "";
}

async function control(op, params){
  try{
    const res = await post("/api/control", {op, params});
    if(res && res.status !== undefined) render(res);
  }catch(e){
    addMsg("sys", "Control failed: " + e.message);
  }
}

async function tick(){
  try{
    const r = await fetch("/api/state");
    state = await r.json();
    render(state);
  }catch(e){}
}

async function loadConfig(){
  try{
    const r = await fetch("/api/config");
    const cfg = await r.json();
    reflectMode(cfg.conversation_mode || cfg.api_mode || "command");
  }catch(e){ badge.textContent = "API: ?"; }
}

function render(s){
  pill.textContent = s.status;
  pill.className = s.status;

  if(s.challenge){
    const focus = s.challenge.focus_door ? " · door " + s.challenge.focus_door : "";
    challengeEl.innerHTML = "Challenge: <b>" + esc(s.challenge.description) + "</b>" + esc(focus);
  }
  setNotice(s.notice || (s.worker_error ? "worker error: " + s.worker_error : ""));

  drawWorld(s.world);
  meta.innerHTML = s.world.present
    ? `steps ${s.world.steps}/${s.world.max_steps} · last <span class="ev">${esc(s.world.last_action||"–")}</span>` +
      (s.world.finished ? " · finished" :
       (s.world.last_events.length ? " · " + s.world.last_events.map(e=>e.join(" ")).map(esc).join(", ") : " · exploring"))
    : "no environment yet — press Start";
  renderMemory(s.memory, s.trace);
  renderTeaching(s.teaching);
}

function drawWorld(w){
  const ctx = cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!w.present){ ctx.fillStyle="#93a5c4"; ctx.font="14px sans-serif"; ctx.fillText("No world loaded.",40,150); return; }
  const CW=60, CH=60, OX=0, OY=0;
  ctx.font = "bold 16px sans-serif";
  for(let x=0;x<7;x++) for(let y=0;y<5;y++){
    ctx.fillStyle = (x+y)%2 ? "#101a2a" : "#0c1422";
    ctx.fillRect(OX+x*CW, OY+y*CH, CW, CH);
  }
  ctx.fillStyle = "#2e3c55";
  for(const [x,y] of w.walls) ctx.fillRect(OX+x*CW, OY+y*CH, CW, CH);
  ctx.strokeStyle = "#5ee6a0"; ctx.lineWidth=3;
  ctx.strokeRect(OX+w.goal[0]*CW+6, OY+w.goal[1]*CH+6, CW-12, CH-12);
  ctx.fillStyle="#5ee6a0"; ctx.fillText("G", OX+w.goal[0]*CW+20, OY+w.goal[1]*CH+36);
  for(const [d,c] of Object.entries(w.doors)){
    const cell = w.door_cell[d];
    ctx.fillStyle = c ? "#5ee6a0" : "#ff8a8a";
    ctx.fillRect(OX+cell[0]*CW+10, OY+cell[1]*CH+10, CW-20, CH-20);
    ctx.fillStyle = "#0a1019";
    ctx.fillText(d, OX+cell[0]*CW+16, OY+cell[1]*CH+36);
  }
  for(const [s,c] of Object.entries(w.switch_cell)){
    const on = w.switches[s];
    ctx.fillStyle = on ? "#ffd166" : "#5a6b86";
    ctx.beginPath(); ctx.arc(OX+c[0]*CW+CW/2, OY+c[1]*CH+CH/2, 14, 0, 7);
    ctx.fill(); ctx.fillStyle="#0a1019"; ctx.fillText(s, OX+c[0]*CW+14, OY+c[1]*CH+38);
  }
  for(const [p,c] of Object.entries(w.plate_cell)){
    const load = w.plates[p];
    ctx.fillStyle = "#3a4a6b"; ctx.strokeStyle="#93a5c4";
    ctx.beginPath(); ctx.arc(OX+c[0]*CW+CW/2, OY+c[1]*CH+CH/2, 16, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#0a1019"; ctx.fillText(load==="none"?"":load, OX+c[0]*CW+16, OY+c[1]*CH+38);
  }
  for(const [o,c] of Object.entries(w.objs)){
    ctx.fillStyle = "#c9a6ff"; ctx.beginPath(); ctx.arc(OX+c[0]*CW+CW/2, OY+c[1]*CH+CH/2, 12, 0, 7); ctx.fill();
    ctx.fillStyle="#0a1019"; ctx.fillText(o, OX+c[0]*CW+18, OY+c[1]*CH+36);
  }
  const [px,py] = w.pos;
  ctx.fillStyle = "#5ec8ff"; ctx.beginPath(); ctx.arc(OX+px*CW+CW/2, OY+py*CH+CH/2, 15, 0, 7); ctx.fill();
  ctx.fillStyle="#062033"; ctx.font="bold 14px sans-serif"; ctx.fillText("M", OX+px*CW+17, OY+py*CH+35);
}

function renderMemory(m, tr){
  if(!m) return;
  const st = m.stats||{};
  let html = '<div class="kpi">';
  html += `<div><b>${st.verified||0}</b><span>verified</span></div>`;
  html += `<div><b>${st.contradicted||0}</b><span>contradicted</span></div>`;
  html += `<div><b>${(st.hypothesis||0)+(st.predicted||0)}</b><span>uncertain</span></div>`;
  html += `<div><b>${m.generated||0}</b><span>generated</span></div></div>`;
  (m.hypotheses||[]).slice(0,30).forEach(h=>{
    const conf = Math.round((h.confidence||0)*100);
    const cls = "hyp " + (h.status==="verified"?"verified":h.status==="contradicted"?"contradicted":h.status==="predicted"?"predicted":"");
    html += `<div class="${cls}">` +
      `<div class="hyp-top"><span>door ${esc(h.door)}</span><span class="tag">[${esc(h.status)}]</span></div>` +
      `<div class="ant">${esc(h.antecedent_text||"(empty)")}</div>` +
      `<div class="bar"><i style="width:${conf}%"></i></div>` +
      `<div class="trace">support ${h.sup} · contradiction ${h.con} · confidence ${conf}%` +
      (h.from_earlier_episodes ? " · from earlier episodes" : "") +
      `</div></div>`;
  });
  if(tr){
    html += '<div class="trace" style="margin-top:10px">memory actions: '+((tr.memory_actions||0))+
           ' · correct '+(tr.memory_correct||0)+' · incorrect '+(tr.memory_incorrect||0)+
           ' · hypothesis retrievals '+(tr.hypothesis_retrieved||0)+
           ' · cross-epoch transfer '+(tr.cross_epoch_transfer_retrieved||0)+'</div>';
  }
  memo.innerHTML = html;
}

function renderTeaching(t){
  if(!t) return;
  const st = t.stats||{};
  const d = t.memory_delta||{};
  let html = `<div class="teach-delta">guidance applied: ${st.guidance_applied||0} · claims: ${st.claims_added||0} · `+
             `hypotheses ${(d.before||{}).hypotheses||0} → ${(d.after||{}).hypotheses||0} · `+
             `verified ${(d.before||{}).verified||0} → ${(d.after||{}).verified||0}</div>`;
  (t.inputs||[]).slice(-4).reverse().forEach(inp=>{
    const atoms = (inp.atoms||[]).map(a=>a.join(" ")).join(", ") || "";
    html += `<div class="teach-item"><b>${esc(inp.kind)}:</b> ${esc(inp.label||atoms)}`+
            `<span class="muted"> · door ${esc(inp.door||"—")}</span></div>`;
  });
  (t.objectives||[]).slice(-2).reverse().forEach(o=>{
    html += `<div class="teach-item"><b>objective:</b> ${esc(o.text)}</div>`;
  });
  (t.experiments_tail||[]).slice(-4).reverse().forEach(e=>{
    html += `<div class="teach-item"><b>experiment:</b> ${esc(e.action)} → ${esc(e.door)} ${esc(e.event)}</div>`;
  });
  teachArea.innerHTML = html || '<div class="muted">No teaching yet — give guidance, a claim, or an objective.</div>';
}

async function teachSend(){
  const text = teachInput.value.trim();
  if(!text) return;
  teachInput.value = "";
  try{
    const res = await post("/api/teaching", {kind:"hint", text});
    if(res && res.teaching) renderTeaching(res.teaching);
  }catch(e){
    addMsg("sys", "Teaching hint not accepted: " + e.message);
  }
}

$("send").onclick = send;
input.addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });
$("teach-send").onclick = teachSend;
teachInput.addEventListener("keydown", e=>{ if(e.key==="Enter") teachSend(); });
document.querySelectorAll("#controls button").forEach(b=>{
  b.onclick = ()=> control(b.dataset.op);
});
document.querySelectorAll("#chips .chip").forEach(c=>{
  c.onclick = ()=>{ input.value = c.dataset.text; send(); };
});

addMsg("bot", "Hello! I'm Metargon. Ask me anything — or say 'help'.");
loadConfig();
setInterval(tick, 250);
tick();
